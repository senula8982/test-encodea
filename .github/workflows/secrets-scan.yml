name: Secrets Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  scan:
    name: Run Encodea Secrets Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Encodea Secrets Scanner
        uses: EncodeaOSS/Encodea-Secrets-Scanner@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
